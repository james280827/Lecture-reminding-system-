<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Lecture Reminder</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #17120f;
            color: #f5eee8;
            min-height: 100vh;
        }

        .header {
            background: #241a15;
            padding: 25px 20px;
            border-bottom: 1px solid #4b3428;
        }

        .header h1 {
            color: #d6a77a;
            margin-bottom: 6px;
        }

        .header p {
            color: #bca99b;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .admin-badge {
            display: inline-block;
            background: #a66b3f;
            color: white;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #241a15;
            border: 1px solid #4b3428;
            border-radius: 15px;
            padding: 20px;
        }

        .stat-card span {
            font-size: 28px;
        }

        .stat-card h3 {
            color: #d6a77a;
            font-size: 25px;
            margin-top: 8px;
        }

        .stat-card p {
            color: #bca99b;
            font-size: 13px;
        }

        .form-card {
            background: #241a15;
            border: 1px solid #4b3428;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-card h2 {
            color: #d6a77a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #d8c7ba;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            background: #17120f;
            color: white;
            border: 1px solid #5a4030;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #d6a77a;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #a66b3f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #c18455;
        }

        .lecture-section {
            margin-bottom: 30px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title h2 {
            color: #d6a77a;
        }

        .lecture-card {
            background: #241a15;
            border: 1px solid #4b3428;
            border-left: 5px solid #a66b3f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .lecture-card h3 {
            color: #e2b991;
            margin-bottom: 10px;
        }

        .lecture-info {
            display: grid;
            gap: 7px;
            color: #c9b8aa;
            font-size: 14px;
        }

        .delete-btn {
            margin-top: 15px;
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            background: #713f35;
            color: white;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #914d40;
        }

        .logout-btn {
            margin-top: 15px;
            padding: 10px 16px;
            border: 1px solid #5a4030;
            border-radius: 8px;
            background: #30231c;
            color: #d6a77a;
            cursor: pointer;
        }

        .empty-message {
            background: #241a15;
            border: 1px solid #4b3428;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            color: #a99688;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


    <header class="header">

        <h1>
            👑 Admin Dashboard
        </h1>

        <p>
            Lecture Reminder System Management
        </p>

        <span class="admin-badge">
            ADMIN ACCESS
        </span>

        <br>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            🚪 Logout
        </button>

    </header>


    <main class="container">


        <section class="dashboard">

            <div class="stat-card">

                <span>📚</span>

                <h3 id="totalLectures">
                    0
                </h3>

                <p>
                    Total Lectures
                </p>

            </div>


            <div class="stat-card">

                <span>🔔</span>

                <h3 id="upcomingLectures">
                    0
                </h3>

                <p>
                    Upcoming Lectures
                </p>

            </div>


            <div class="stat-card">

                <span>⚙️</span>

                <h3>
                    ADMIN
                </h3>

                <p>
                    System Control
                </p>

            </div>

        </section>


        <section class="form-card">

            <h2>
                ➕ Add New Lecture
            </h2>


            <form id="lectureForm">


                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="Example: Data Structures"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Instructor
                    </label>

                    <input
                        type="text"
                        id="instructor"
                        placeholder="Instructor name"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Time
                        </label>

                        <input
                            type="time"
                            id="time"
                            required
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label>
                        Room
                    </label>

                    <input
                        type="text"
                        id="room"
                        placeholder="Example: Room 204"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Lecture information..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="add-btn"
                >
                    ➕ Add Lecture
                </button>


            </form>

        </section>


        <section class="lecture-section">

            <div class="section-title">

                <h2>
                    📅 Manage Lectures
                </h2>

            </div>


            <div id="lectureList">

                <div class="empty-message">
                    Loading lectures...
                </div>

            </div>

        </section>


    </main>


    <script
        type="module"
        src="admin.js"
    ></script>


</body>

          </html>
